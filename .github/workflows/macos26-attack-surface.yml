name: macOS 26 Full XPC Attack Surface Enumeration

on:
  workflow_dispatch:

jobs:
  enumerate:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: System info
        run: sw_vers && echo "UID=$(id -u)" && csrutil status

      - name: All running com.apple services
        run: launchctl list | awk '{print $3}' | grep "^com\.apple\." | sort -u

      - name: New PrivateFrameworks with AI or Intelligence
        run: |
          ls /System/Library/PrivateFrameworks/ | grep -i "intelligence\|OSIntel\|privatecloudcompute\|AIKit\|GenAI\|FoundationModel\|OnDeviceModel\|WritingTools\|CoreDuet\|proactive" | sort
          echo ""
          ls /usr/libexec/ | grep -i "intelligence\|prediction\|privatecloud\|siri\|duet\|suggest\|writing" | sort

      - name: Private Cloud Compute binary map
        run: |
          echo "=== PCC binaries ==="
          find /System /usr/libexec /usr/bin -name "*privatecloudcompute*" -o -name "*PrivateCloudCompute*" 2>/dev/null | sort || echo "(none)"
          echo ""
          echo "=== PCC LaunchDaemons ==="
          find /System/Library/LaunchDaemons /System/Library/LaunchAgents -name "*privatecloudcompute*" -o -name "*privatecloud*" 2>/dev/null | while read f; do
            echo "--- $f ---"
            plutil -p "$f" 2>/dev/null | grep -A 2 "MachServices\|Label\|Program" | head -15 || true
          done || echo "(none)"
        continue-on-error: true

      - name: Siri and Intelligence daemon MachService dump
        run: |
          for plist in \
            /System/Library/LaunchDaemons/com.apple.siriknowledged.plist \
            /System/Library/LaunchDaemons/com.apple.siriinferenced.plist \
            /System/Library/LaunchAgents/com.apple.siriinferenced.plist \
            /System/Library/LaunchDaemons/com.apple.ospredictiond.plist \
            /System/Library/LaunchDaemons/com.apple.intelligencecontextd.plist \
            /System/Library/LaunchAgents/com.apple.intelligencecontextd.plist \
            /System/Library/LaunchDaemons/com.apple.privatecloudcomputed.plist \
            /System/Library/LaunchAgents/com.apple.privatecloudcomputed.plist; do
            if [ -f "$plist" ]; then
              echo "=== $plist ==="
              plutil -p "$plist" 2>/dev/null | grep -A 2 "MachServices\|Label\|UserName\|RunAtLoad" | head -30 || true
            fi
          done
        continue-on-error: true

      - name: CoreDuet daemon surface
        run: |
          echo "=== CoreDuet services ==="
          launchctl list | grep -i "coreduet\|duet" || echo "(none running)"
          for plist in /System/Library/LaunchDaemons/com.apple.coreduetd.plist /System/Library/LaunchAgents/com.apple.coreduetd.plist; do
            if [ -f "$plist" ]; then
              echo "=== $plist ==="
              plutil -p "$plist" 2>/dev/null | head -40 || true
            fi
          done
        continue-on-error: true

      - name: LaunchDaemons with MachServices
        run: |
          for plist in /System/Library/LaunchDaemons/*.plist; do
            if plutil -p "$plist" 2>/dev/null | grep -q "MachServices"; then
              echo "--- $(basename $plist) ---"
              plutil -p "$plist" 2>/dev/null | grep -A 1 "MachServices" | head -10 || true
            fi
          done | head -200
        continue-on-error: true
