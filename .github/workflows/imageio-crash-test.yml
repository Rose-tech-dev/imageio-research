name: ImageIO Crash Test (macOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  crash-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System info
        run: |
          sw_vers
          sips --version 2>/dev/null || echo "sips: $(which sips)"
          python --version
          uname -m
          # SIP status: if disabled, DYLD_INSERT_LIBRARIES works on system binaries (qlmanage, sips)
          csrutil status 2>/dev/null || echo "csrutil not available"
          # Check if qlmanage is SIP-protected
          ls -l /usr/bin/qlmanage /usr/bin/sips 2>/dev/null || true
          # Check if libgmalloc is available
          ls -la /usr/lib/libgmalloc.dylib 2>/dev/null && echo "libgmalloc: AVAILABLE" || echo "libgmalloc: NOT FOUND"

      - name: Generate corpus + reference JPEGL via ImageMagick
        run: |
          python dng_fuzzer.py --corpus

          echo ""
          echo "======================================================"
          echo " Reference JPEGL: Generate via ImageMagick (convert)"
          echo " Goal: produce a JPEGL bitstream Apple's decoder DOES"
          echo " accept, then create SPP mismatch variants of it."
          echo "======================================================"

          # Check ImageMagick availability and JPEGL support
          which magick 2>/dev/null && echo "magick: $(magick --version | head -1)" || \
          which convert 2>/dev/null && echo "convert: $(convert --version | head -1)" || \
          echo "ImageMagick: NOT FOUND"

          python3 << 'PYEOF'
          import subprocess, os, struct

          def run(cmd, timeout=30):
              r = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout)
              return r.returncode, r.stdout, r.stderr

          # Try to create a JPEGL TIFF via ImageMagick
          # -compress Lossless = JPEG-Lossless (SOF3) in TIFF context
          # -depth 8 = 8-bit samples
          GRAY64 = '/tmp/ref_jpegl_gray_1spp.tiff'
          RGB64  = '/tmp/ref_jpegl_rgb_3spp.tiff'

          # ImageMagick xc:gray creates a uniform gray image
          rc, out, err = run(f'magick -size 64x64 xc:gray50 -depth 8 -compress Lossless {GRAY64} 2>&1 || convert -size 64x64 xc:gray50 -depth 8 -compress Lossless {GRAY64} 2>&1')
          print(f'gray JPEGL TIFF rc={rc}: {(out+err).strip()[:100]}')

          rc, out, err = run(f'magick -size 64x64 xc:gray50 -colorspace RGB -depth 8 -compress Lossless {RGB64} 2>&1 || convert -size 64x64 xc:gray50 -colorspace RGB -depth 8 -compress Lossless {RGB64} 2>&1')
          print(f'RGB  JPEGL TIFF rc={rc}: {(out+err).strip()[:100]}')

          for path in [GRAY64, RGB64]:
              if not os.path.exists(path):
                  print(f'  {path}: NOT CREATED')
                  continue
              sz = os.path.getsize(path)
              # Scan for JPEGL SOF3 marker (0xFFC3) to verify it's actually JPEGL
              with open(path, 'rb') as f:
                  data = f.read()
              has_sof3 = b'\xff\xc3' in data
              has_sof0 = b'\xff\xc0' in data
              print(f'  {path}: {sz}B  SOF3={has_sof3}  SOF0={has_sof0}')

          # Quick test: can sips decode the reference JPEGL TIFFs?
          for path in [GRAY64, RGB64]:
              if not os.path.exists(path):
                  continue
              r = subprocess.run(
                  ['sips', '-g', 'format', '-g', 'pixelWidth', '-g', 'pixelHeight', '-g', 'samplesPerPixel', path],
                  capture_output=True, text=True, timeout=10
              )
              print(f'  sips metadata {os.path.basename(path)}: rc={r.returncode}  {r.stdout.strip()[:120]}')
          PYEOF
          echo ""
          echo "Generated corpus files:"
          ls -lah corpus/

      - name: MUTATION - patch SPP in ImageMagick JPEGL TIFF to create mismatch
        if: always()
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import subprocess, os, struct

          def patch_tiff_spp(src_path, dst_path, new_spp):
              """
              Patch SamplesPerPixel (tag 277) in a TIFF file without rebuilding.
              Only works if SPP count==1 (inline value).
              """
              with open(src_path, 'rb') as f:
                  data = bytearray(f.read())

              # Detect byte order
              if data[:2] == b'II':
                  order = '<'
              elif data[:2] == b'MM':
                  order = '>'
              else:
                  print(f'Not a TIFF: {src_path}')
                  return False

              ifd_offset = struct.unpack_from(order + 'I', data, 4)[0]
              n_entries = struct.unpack_from(order + 'H', data, ifd_offset)[0]
              entry_base = ifd_offset + 2

              for i in range(n_entries):
                  off = entry_base + i * 12
                  tag, typ, count = struct.unpack_from(order + 'HHI', data, off)
                  if tag == 277:  # SamplesPerPixel
                      if count == 1 and typ in (3, 4):  # SHORT or LONG, single value
                          val_offset = off + 8
                          if typ == 3:  # SHORT
                              struct.pack_into(order + 'H', data, val_offset, new_spp)
                              struct.pack_into(order + 'H', data, val_offset + 2, 0)
                          else:  # LONG
                              struct.pack_into(order + 'I', data, val_offset, new_spp)
                          print(f'  Patched SPP: {tag}={new_spp} at offset {val_offset} in {src_path}')
                          with open(dst_path, 'wb') as f:
                              f.write(data)
                          return True
                      else:
                          print(f'  SPP tag found but count={count} typ={typ}, cannot patch inline')
                          return False
              print(f'  SPP tag not found in {src_path}')
              return False

          # Reference JPEGL TIFFs created by ImageMagick
          GRAY_REF = '/tmp/ref_jpegl_gray_1spp.tiff'

          if not os.path.exists(GRAY_REF):
              print('[SKIP] ImageMagick did not create reference JPEGL. Trying libtiff...')
              # Try alternative: use tiffcp or tiff utility
              rc = os.system('brew install libtiff 2>/dev/null')
          else:
              print(f'[OK] Reference JPEGL exists: {GRAY_REF} ({os.path.getsize(GRAY_REF)}B)')

              # Test: can Swift CGImageSource decode the ImageMagick JPEGL?
              import subprocess as sp
              swift_code = '''
          import Foundation, ImageIO, CoreGraphics
          let url = URL(fileURLWithPath: "/tmp/ref_jpegl_gray_1spp.tiff") as CFURL
          guard let src = CGImageSourceCreateWithURL(url, nil) else { print("NO_SRC"); exit(1) }
          let uti = CGImageSourceGetType(src) as String? ?? "nil"
          guard let img = CGImageSourceCreateImageAtIndex(src, 0, nil) else { print("NO_IMG uti=\\(uti)"); exit(1) }
          let cs = CGColorSpaceCreateDeviceGray()
          guard let ctx = CGContext(data: nil, width: img.width, height: img.height,
              bitsPerComponent: 8, bytesPerRow: img.width, space: cs,
              bitmapInfo: CGImageAlphaInfo.none.rawValue) else { print("NO_CTX"); exit(1) }
          ctx.setFillColor(gray: 1.0, alpha: 1.0)
          ctx.fill(CGRect(x:0,y:0,width:img.width,height:img.height))
          ctx.draw(img, in: CGRect(x:0,y:0,width:img.width,height:img.height))
          var px: UInt8 = 0
          if let p = ctx.data { px = p.load(as: UInt8.self) }
          let v = px == 255 ? "DRAW_FAILED" : (px >= 120 && px <= 136 ? "OK_MIDPOINT" : "px=\\(px)")
          print("CGImg \\(uti) \\(img.width)x\\(img.height) \\(v)")
          '''
              open('/tmp/ref_jpegl_test.swift', 'w').write(swift_code)
              r = sp.run(['swift', '/tmp/ref_jpegl_test.swift'],
                         capture_output=True, text=True, timeout=30)
              print(f'Reference JPEGL CGImageSource: {r.stdout.strip()} {r.stderr.strip()[:60]}')

              # Now create mismatch variants: change SPP without changing inner JPEGL Nf
              # Variant 1: SPP=3 outer, Nf=1 inner (OOB READ — spp > nf)
              SPP3_PATH = '/tmp/ref_jpegl_mutated_3spp_1nf.tiff'
              if patch_tiff_spp(GRAY_REF, SPP3_PATH, 3):
                  r = sp.run(['swift', '/tmp/ref_jpegl_test.swift'.replace(
                      'ref_jpegl_gray_1spp.tiff', 'ref_jpegl_mutated_3spp_1nf.tiff')],
                      capture_output=True, text=True, timeout=30)
                  # Quick test via a modified swift file
                  swift_mut = swift_code.replace('ref_jpegl_gray_1spp.tiff', 'ref_jpegl_mutated_3spp_1nf.tiff')
                  open('/tmp/ref_jpegl_mut.swift', 'w').write(swift_mut)
                  r2 = sp.run(['swift', '/tmp/ref_jpegl_mut.swift'],
                               capture_output=True, text=True, timeout=30)
                  print(f'Mutated SPP=3 Nf=1: {r2.stdout.strip()} {r2.stderr.strip()[:60]}')

                  # Also test via sips (look for crash/error)
                  r3 = sp.run(
                      ['sips', '-s', 'format', 'png', SPP3_PATH, '--out', '/tmp/mut_decode.png'],
                      capture_output=True, text=True, timeout=20,
                      env={**os.environ, 'MallocScribble': '1', 'MallocGuardEdges': '1'}
                  )
                  print(f'sips mutated SPP=3 Nf=1: rc={r3.returncode}  {r3.stderr.strip()[:80]}')
          PYEOF

      - name: DIAGNOSTIC - file type and Swift CGImageSource (direct ImageIO)
        if: always()
        continue-on-error: true
        run: |
          echo "======================================================"
          echo " file(1) magic-byte type detection"
          echo "======================================================"
          file corpus/*.dng | sed 's|corpus/||'

          echo ""
          echo "======================================================"
          echo " Swift CGImageSource: direct ImageIO pipeline (no sips)"
          echo " uti=com.adobe.raw-image → DNG Camera Raw plugin used"
          echo " uti=public.tiff         → generic TIFF plugin (bug)"
          echo " NO_IMG → plugin loaded but pixel decode failed"
          echo " NO_SRC → ImageIO refused to open the file entirely"
          echo "======================================================"
          python3 << 'PYEOF'
          # Write Swift file via Python (avoids YAML indentation issues with heredocs)
          # \( in Swift string interpolation is kept literal via Python list-of-strings
          lines = [
              'import Foundation',
              'import ImageIO',
              'import CoreGraphics',
              '',
              'let dir = "corpus"',
              'guard let entries = try? FileManager.default.contentsOfDirectory(atPath: dir) else {',
              '    print("Cannot read corpus dir"); exit(1)',
              '}',
              'let files = entries.filter { $0.hasSuffix(".dng") }.sorted()',
              '',
              'print(String(repeating: "=", count: 80))',
              'print(" Swift CGImageSource — raw ImageIO pipeline + FORCED pixel render")',
              'print(" [OK+RENDER] = CGImageSourceCreateImageAtIndex succeeded AND pixels decoded")',
              'print(" [OK+CRASH ] = pixel decode triggered crash (OOB write in JPEGL decoder)")',
              'print(" [NO_IMG  ] = CGImageSourceCreateImageAtIndex returned nil")',
              'print(" [NO_CTX  ] = CGImageSourceCreateImageAtIndex ok but CGContext failed")',
              'print(String(repeating: "=", count: 80))',
              '',
              'for fname in files {',
              '    let url = URL(fileURLWithPath: "\\(dir)/\\(fname)") as CFURL',
              '    guard let src = CGImageSourceCreateWithURL(url, nil) else {',
              '        print("  [NO_SRC  ] \\(fname)")',
              '        continue',
              '    }',
              '    let uti = (CGImageSourceGetType(src) as String?) ?? "nil"',
              '    guard let img = CGImageSourceCreateImageAtIndex(src, 0, nil) else {',
              '        print("  [NO_IMG  ] \\(fname)  uti=\\(uti)")',
              '        continue',
              '    }',
              '    let w = img.width',
              '    let h = img.height',
              '    // Force actual pixel decode by rendering into CGContext.',
              '    // CGImageSourceCreateImageAtIndex is lazy (returns metadata only).',
              '    // ctx.draw() triggers the actual JPEGL decode — OOB write crashes here.',
              '    let cs = CGColorSpaceCreateDeviceGray()',
              '    guard let ctx = CGContext(',
              '        data: nil, width: w, height: h, bitsPerComponent: 8,',
              '        bytesPerRow: w, space: cs,',
              '        bitmapInfo: CGImageAlphaInfo.none.rawValue) else {',
              '        print("  [NO_CTX  ] \\(fname)  uti=\\(uti)  \\(w)x\\(h)")',
              '        continue',
              '    }',
              '    // Pre-fill with white=255 so we can distinguish draw failure (px=255)',
              '    // from decode success (px≈128, midpoint) or all-black image (px=0).',
              '    ctx.setFillColor(gray: 1.0, alpha: 1.0)',
              '    ctx.fill(CGRect(x: 0, y: 0, width: w, height: h))',
              '    ctx.draw(img, in: CGRect(x: 0, y: 0, width: w, height: h))',
              '    var firstPx: UInt8 = 0',
              '    if let ptr = ctx.data {',
              '        firstPx = ptr.load(as: UInt8.self)',
              '    }',
              '    // px=255  → draw() failed silently (JPEGL decode error in CoreGraphics)',
              '    // px≈128  → draw() succeeded, midpoint image decoded correctly',
              '    // px=0    → draw() succeeded, actual image is all-black',
              '    let verdict = firstPx == 255 ? "DRAW_FAILED" : (firstPx >= 120 && firstPx <= 136 ? "OK_MIDPOINT" : "px=\\(firstPx)")',
              '    print("  [OK+RENDER] \\(fname)  uti=\\(uti)  \\(w)x\\(h)  \\(verdict)")',
              '}',
          ]
          open('/tmp/iosrc.swift', 'w').write('\n'.join(lines) + '\n')
          PYEOF
          swift /tmp/iosrc.swift

      - name: DIAGNOSTIC - sips metadata read (sips -g all)
        id: diag_metadata
        if: always()
        run: |
          echo "======================================================"
          echo " PHASE 1: sips -g all (metadata read, no pixel decode)"
          echo " rc=0 → file recognized as image format"
          echo " rc!=0 → format recognition fails (structural TIFF bug)"
          echo "======================================================"
          for f in corpus/*.dng; do
            fname=$(basename "$f")
            out=$(sips -g format -g pixelWidth -g pixelHeight "$f" 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              fmt=$(echo "$out" | grep 'format:' | awk '{print $2}')
              w=$(echo "$out" | grep 'pixelWidth:' | awk '{print $2}')
              h=$(echo "$out" | grep 'pixelHeight:' | awk '{print $2}')
              echo "  [META-OK]  $fname  format=$fmt  ${w}x${h}"
            else
              echo "  [META-ERR rc=$rc] $fname"
              echo "    $out" | head -3
            fi
          done

      - name: DIAGNOSTIC - sips output format matrix (which format lets decoder run?)
        if: always()
        run: |
          python3 << 'PYEOF'
          import subprocess, os

          # If CTRL returns rc=0 for any format, the decoder IS running cleanly.
          # If CTRL still returns rc=13 for all formats, the bitstream itself is rejected.
          # A crash (rc=139/6) on mismatch cases but not CTRL confirms OOB bug.
          test_files = [
              'corpus/DIAG_plain_tiff_rgb_8b.dng',
              'corpus/CTRL_tiff_jpegl_3spp_3nf_8b.dng',
              'corpus/CTRL_tiff_jpegl_1spp_1nf_8b.dng',
              'corpus/tiff_jpegl_1spp_3nf_8b.dng',
              'corpus/tiff_jpegl_3spp_1nf_8b.dng',
              'corpus/DIAG_dng_cfa_uncompressed.dng',
              'corpus/CTRL_cfa_jpegl_1spp_1nf_16b.dng',
              'corpus/cfa_jpegl_1spp_3nf_16b.dng',
              'corpus/CTRL_lr_jpegl_3spp_3nf_16b.dng',
              'corpus/lr_jpegl_3spp_1nf_16b.dng',
          ]
          formats = ['bmp', 'tiff', 'jpeg', 'png']

          hdr = f"  {'File':<50}" + "".join(f"  {f:>4}" for f in formats)
          print("=" * len(hdr))
          print(" sips rc per output format  (0=OK  13=err  -1=hang)")
          print(hdr)
          print("=" * len(hdr))

          for path in test_files:
              if not os.path.exists(path):
                  continue
              fname = os.path.basename(path)
              row = f"  {fname:<50}"
              for fmt in formats:
                  out = f'/tmp/sips_{fmt}.{fmt}'
                  try:
                      r = subprocess.run(
                          ['sips', '-s', 'format', fmt, path, '--out', out],
                          capture_output=True, text=True, timeout=20
                      )
                      row += f"  {r.returncode:>4}"
                  except subprocess.TimeoutExpired:
                      row += "  HANG"
              print(row)
          PYEOF

      - name: DIAGNOSTIC - qlmanage (QuickLook, 8s timeout + crash report monitoring)
        if: always()
        run: |
          mkdir -p /tmp/ql_out
          # Baseline: show what qlmanage creates for a known-good PNG (confirms thumbnail naming)
          echo "--- qlmanage baseline on known-good PNG ---"
          python3 -c "
from PIL import Image
img = Image.new('RGB', (64,64), (128,0,128))
img.save('/tmp/known_good.png')
" 2>/dev/null || convert -size 64x64 xc:purple /tmp/known_good.png 2>/dev/null || true
          qlmanage -t -s 64 -o /tmp/ql_out /tmp/known_good.png 2>&1 || true
          echo "--- /tmp/ql_out contents after known-good PNG ---"
          ls -la /tmp/ql_out/ 2>/dev/null || echo "(empty)"
          rm -f /tmp/ql_out/*.png  # clean for JPEGL tests
          echo "---"
          python3 << 'PYEOF'
          import subprocess, os, glob, time

          CRASH_DIR = os.path.expanduser("~/Library/Logs/DiagnosticReports")

          def snapshot():
              try:
                  return set(os.listdir(CRASH_DIR))
              except FileNotFoundError:
                  return set()

          def read_report(path):
              try:
                  with open(path, errors='replace') as f:
                      return f.read(4000)
              except Exception as e:
                  return f'(could not read: {e})'

          # Files where SPP != Nf — these are OOB write/read candidates
          MISMATCH_NAMES = {
              'tiff_jpegl_1spp_3nf_8b.dng',       # SPP=1, Nf=3  OOB WRITE
              'tiff_jpegl_3spp_1nf_8b.dng',       # SPP=3, Nf=1  OOB READ
              'tiff_jpegl_1spp_4nf_8b.dng',       # SPP=1, Nf=4  OOB WRITE x4
              'tiff_jpegl_4spp_1nf_8b.dng',       # SPP=4, Nf=1  OOB READ x4
              'diag_dng_gray_jpegl_1spp_3nf_8b.dng',  # DNG gray mismatch
              'diag_dng_rgb_jpegl_3spp_1nf_8b.dng',   # DNG rgb mismatch
          }

          print("=" * 70)
          print(" qlmanage -t  (QuickLook — DIFFERENT JPEGL decoder than sips/CGImageSource)")
          print(" Monitors ~/Library/Logs/DiagnosticReports for crash reports after each render.")
          print(" [QL-OK]      = QuickLook rendered successfully")
          print(" [QL-TIMEOUT] = hung >8s (DoS / infinite-loop bug)")
          print(" [QL-ERR]     = plugin rejected the file")
          print(" *** CRASH    = new DiagnosticReport generated during render")
          print("=" * 70)
          print()

          all_files = sorted(glob.glob('corpus/*.dng'))
          priority = [f for f in all_files if 'CTRL' in f or 'DIAG' in f]
          rest     = [f for f in all_files if f not in priority]
          files    = priority + rest

          crash_reports_found = []

          for f in files:
              if not os.path.exists(f):
                  continue
              fname = os.path.basename(f)
              is_mismatch = fname in MISMATCH_NAMES

              before = snapshot()
              t0 = time.time()
              try:
                  r = subprocess.run(
                      ['qlmanage', '-t', '-s', '64', '-o', '/tmp/ql_out', f],
                      capture_output=True, text=True, timeout=8,
                      env={**os.environ,
                           'MallocScribble': '1',
                           'MallocGuardEdges': '1'},
                  )
                  elapsed = time.time() - t0
                  if r.returncode == 0:
                      tag = '  *** OOB TARGET' if is_mismatch else ''
                      print(f'  [QL-OK]      {fname}{tag}  ({elapsed:.1f}s)')
                  else:
                      print(f'  [QL-ERR rc={r.returncode}] {fname}  ({elapsed:.1f}s)')
                      if r.stderr.strip():
                          print(f'    stderr: {r.stderr.strip()[:120]}')
              except subprocess.TimeoutExpired:
                  elapsed = time.time() - t0
                  print(f'  [QL-TIMEOUT] {fname}  ({elapsed:.1f}s)  <- DoS / infinite loop')
                  continue

              # Inspect thumbnail output file
              ql_out_files = [
                  f'/tmp/ql_out/{os.path.splitext(fname)[0]}.png',
                  f'/tmp/ql_out/{fname}.png',
              ]
              for qf in ql_out_files:
                  if os.path.exists(qf):
                      sz = os.path.getsize(qf)
                      r2 = subprocess.run(
                          ['sips', '-g', 'pixelWidth', '-g', 'pixelHeight', qf],
                          capture_output=True, text=True, timeout=5
                      )
                      dims = '?x?'
                      for ln in r2.stdout.splitlines():
                          if 'pixelWidth:' in ln:
                              dims = ln.split()[-1] + 'x'
                          if 'pixelHeight:' in ln:
                              dims += ln.split()[-1]
                      print(f'    thumbnail: {qf}  {sz}B  {dims}px')
                      break

              # Check for new crash reports immediately after render completes
              time.sleep(0.3)   # brief pause for crash writer to flush
              new = snapshot() - before
              ql_new = {n for n in new if 'qlmanage' in n.lower() or
                        'quicklook' in n.lower() or 'rawcamera' in n.lower() or
                        'imagei' in n.lower()}
              all_new = new  # also show unrelated new reports
              if new:
                  print(f'  *** NEW CRASH REPORTS ({len(new)}) after {fname}:')
                  for report in sorted(new):
                      rpath = os.path.join(CRASH_DIR, report)
                      print(f'  === {report} ===')
                      print(read_report(rpath))
                      crash_reports_found.append(report)
              elif is_mismatch and r.returncode == 0:
                  # QL-OK but no crash — OOB may be silent or heap-layout-dependent
                  print(f'    no crash report — OOB may be silent (heap layout dependent)')

          print()
          print("=" * 70)
          if crash_reports_found:
              print(f'CRASH REPORTS TRIGGERED ({len(crash_reports_found)}):')
              for r in crash_reports_found:
                  print(f'  {r}')
          else:
              print('No new crash reports generated during any qlmanage render.')
              print('If OOB writes occurred they were silent (no guard page hit).')
              print('Next step: run with libgmalloc or AddressSanitizer build.')
          print("=" * 70)
          PYEOF
          echo ""
          echo "--- /tmp/ql_out contents (all qlmanage thumbnail outputs) ---"
          ls -la /tmp/ql_out/ 2>/dev/null | head -40 || echo "(empty)"

      - name: STRESS - qlmanage extreme Nf targets (multi-MB OOB → page fault)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/ql_stress
          # Kill quicklookd so next qlmanage spawns a fresh daemon that inherits our env
          killall quicklookd 2>/dev/null || true
          sleep 1

          python3 << 'PYEOF'
          import subprocess, os, glob, time

          CRASH_DIR = os.path.expanduser("~/Library/Logs/DiagnosticReports")

          def snapshot():
              try:
                  return set(os.listdir(CRASH_DIR))
              except FileNotFoundError:
                  return set()

          def read_crash(path):
              try:
                  with open(path, errors='replace') as f:
                      return f.read(4000)
              except Exception as e:
                  return f'(unreadable: {e})'

          # Prioritise extreme Nf (large OOB) first, then moderate Nf for comparison.
          # Nf=128: SPP=1, 64x64 → 64*64*127 = 524,288 bytes past end of alloc
          # Nf=255: SPP=1, 64x64 → 64*64*254 = 1,044,480 bytes past end of alloc
          TARGETS = [
              ('corpus/tiff_jpegl_1spp_255nf_8b.dng',    1, 255, '64x64   OOB=1,044,480B'),
              ('corpus/tiff_jpegl_1spp_128nf_8b.dng',    1, 128, '64x64   OOB=524,288B'),
              ('corpus/tiff_jpegl_1spp_32nf_8b.dng',     1,  32, '64x64   OOB=126,976B'),
              ('corpus/tiff_jpegl_1spp_32nf_8b_256.dng', 1,  32, '256x256 OOB=2,031,616B'),
              ('corpus/tiff_jpegl_1spp_16nf_8b.dng',     1,  16, '64x64   OOB=61,440B'),
              ('corpus/tiff_jpegl_1spp_4nf_8b.dng',      1,   4, '64x64   OOB=12,288B'),
              ('corpus/tiff_jpegl_1spp_3nf_8b.dng',      1,   3, '64x64   OOB=8,192B'),
              ('corpus/tiff_jpegl_3spp_1nf_8b.dng',      3,   1, '64x64   OOB READ'),
          ]

          print("=" * 80)
          print(" Extreme Nf stress: each file through qlmanage with crash monitoring")
          print(" At Nf=255 the OOB write is >1MB — must cross a page boundary → SIGSEGV")
          print(" If QL-OK for Nf=255 without crash: decoder is clamping Nf at SPP (safe)")
          print("=" * 80)

          gmalloc_env = {
              **os.environ,
              'MallocScribble':    '1',
              'MallocGuardEdges':  '1',
              # Try libgmalloc — silently ignored if SIP protects qlmanage
              'DYLD_INSERT_LIBRARIES': '/usr/lib/libgmalloc.dylib',
              'MALLOC_PROTECT_BEFORE': '1',
          }

          baseline = snapshot()
          any_crash = False

          for path, spp, nf, desc in TARGETS:
              if not os.path.exists(path):
                  print(f'  [MISSING] {os.path.basename(path)}')
                  continue
              fname = os.path.basename(path)
              before = snapshot()
              try:
                  r = subprocess.run(
                      ['qlmanage', '-t', '-s', '64', '-o', '/tmp/ql_stress', path],
                      capture_output=True, text=True, timeout=10,
                      env=gmalloc_env,
                  )
                  time.sleep(0.5)
                  new = snapshot() - before
                  rc_str = f'rc={r.returncode}'
                  if new:
                      print(f'  [QL-OK CRASH ***] {fname}  {desc}  {rc_str}')
                      for report in sorted(new):
                          rp = os.path.join(CRASH_DIR, report)
                          print(f'  === {report} ===')
                          print(read_crash(rp))
                      any_crash = True
                  elif r.returncode == 0:
                      print(f'  [QL-OK no crash]  {fname}  {desc}')
                  else:
                      print(f'  [QL-ERR]          {fname}  {desc}  {rc_str}')
                      if r.stderr.strip():
                          print(f'    {r.stderr.strip()[:100]}')
              except subprocess.TimeoutExpired:
                  print(f'  [QL-TIMEOUT]      {fname}  {desc}')

          final_new = snapshot() - baseline
          print(f'\nTotal new crash reports: {len(final_new)}')
          for r in sorted(final_new):
              print(f'  {r}')

          if not any_crash:
              print()
              print('No crashes with extreme Nf values.')
              print('If QL-OK for Nf=255: JPEGL decoder clamps Nf at TIFF SPP (safe path exists).')
              print('If QL-ERR/MISSING for Nf=255: decoder rejects unknown Nf values (safe).')
              print('Next: write non-SIP-protected Swift binary + link libgmalloc.')
          PYEOF

      - name: DIAGNOSTIC - Swift in-process QLThumbnail (non-SIP binary + libgmalloc)
        if: always()
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          lines = [
              'import Foundation',
              'import ImageIO',
              'import CoreGraphics',
              '// In-process JPEGL decode using CGImageSource + forced render.',
              '// Unlike qlmanage (SIP-protected), this binary is NOT SIP-protected,',
              '// so DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib is honoured.',
              '// Run via:  DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib swift /tmp/ql_inproc.swift',
              '',
              'let targets: [(String, Int, Int)] = [',
              '    ("corpus/tiff_jpegl_1spp_255nf_8b.dng",  1, 255),',
              '    ("corpus/tiff_jpegl_1spp_128nf_8b.dng",  1, 128),',
              '    ("corpus/tiff_jpegl_1spp_32nf_8b.dng",   1,  32),',
              '    ("corpus/tiff_jpegl_1spp_16nf_8b.dng",   1,  16),',
              '    ("corpus/tiff_jpegl_1spp_4nf_8b.dng",    1,   4),',
              '    ("corpus/tiff_jpegl_1spp_3nf_8b.dng",    1,   3),',
              '    ("corpus/CTRL_tiff_jpegl_1spp_1nf_8b.dng", 1, 1),',
              '    ("corpus/tiff_jpegl_3spp_1nf_8b.dng",    3,   1),',
              ']',
              '',
              'print("=" + String(repeating: "=", count: 79))',
              'print(" Swift in-process CGImageSource + ctx.draw() for extreme Nf JPEGL files")',
              'print(" DRAW_FAILED = CGImageSource accepted file but JPEGL decode failed")',
              'print(" OK_MIDPOINT = JPEGL decoded successfully (decoder clamped Nf at SPP?)")',
              'print(" CRASH       = OOB write hit guard page (libgmalloc required)")',
              'print("=" + String(repeating: "=", count: 79))',
              '',
              'for (path, spp, nf) in targets {',
              '    let url = URL(fileURLWithPath: path) as CFURL',
              '    guard let src = CGImageSourceCreateWithURL(url, nil) else {',
              '        print("  [NO_SRC  ] \\(path)")',
              '        continue',
              '    }',
              '    guard let img = CGImageSourceCreateImageAtIndex(src, 0, nil) else {',
              '        print("  [NO_IMG  ] \\(path)")',
              '        continue',
              '    }',
              '    let w = img.width, h = img.height',
              '    let cs = CGColorSpaceCreateDeviceGray()',
              '    guard let ctx = CGContext(data: nil, width: w, height: h,',
              '        bitsPerComponent: 8, bytesPerRow: w, space: cs,',
              '        bitmapInfo: CGImageAlphaInfo.none.rawValue) else {',
              '        print("  [NO_CTX  ] \\(path)")',
              '        continue',
              '    }',
              '    ctx.setFillColor(gray: 1.0, alpha: 1.0)',
              '    ctx.fill(CGRect(x: 0, y: 0, width: w, height: h))',
              '    ctx.draw(img, in: CGRect(x: 0, y: 0, width: w, height: h))',
              '    var px: UInt8 = 0',
              '    if let p = ctx.data { px = p.load(as: UInt8.self) }',
              '    let v = px == 255 ? "DRAW_FAILED" : (px >= 120 && px <= 136 ? "OK_MIDPOINT" : "px=\\(px)")',
              '    print("  [CGImg ] \\(path)  SPP=\\(spp) Nf=\\(nf)  \\(v)")',
              '}',
          ]
          open('/tmp/ql_inproc.swift', 'w').write('\n'.join(lines) + '\n')
          PYEOF

          echo "--- Running WITHOUT libgmalloc (baseline) ---"
          swift /tmp/ql_inproc.swift

          echo ""
          echo "--- Running WITH DYLD_INSERT_LIBRARIES=libgmalloc (guard pages on every alloc) ---"
          echo "--- If OOB write occurs, this WILL crash with SIGSEGV ---"
          DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib MALLOC_PROTECT_BEFORE=1 \
            swift /tmp/ql_inproc.swift || echo "  CRASHED (rc=$?)"

      - name: Run crash test (forced pixel decode via sips -s format png)
        id: crash_test
        run: |
          python << 'PYEOF'
          import subprocess, os, sys, json, time

          corpus_dir = 'corpus'
          results = []

          files = sorted(f for f in os.listdir(corpus_dir) if f.endswith('.dng'))
          # Use jpeg output: the sips format matrix showed jpeg=0 for TIFF+JPEGL files
          # while png/bmp/tiff all return rc=13 (codec rejects those pixel-format paths).
          # jpeg output forces the JPEG-Lossless decoder to actually run so we can see crashes.
          print(f"Testing {len(files)} files with sips -s format jpeg (forces JPEGL decode)...\n")
          print(f"{'File':<55} {'Status':>8}  {'RC':>5}  {'Time':>6}")
          print("-" * 80)

          out_jpeg = '/tmp/sips_out.jpeg'

          for fname in files:
              path = os.path.join(corpus_dir, fname)
              t0 = time.time()
              try:
                  r = subprocess.run(
                      ['sips', '-s', 'format', 'jpeg', path, '--out', out_jpeg],
                      capture_output=True, text=True, timeout=30,
                      env={**os.environ,
                           'MallocScribble': '1',
                           'MallocGuardEdges': '1',
                           'ASAN_OPTIONS': 'detect_oob_reads=1:halt_on_error=0'},
                  )
                  elapsed = time.time() - t0
                  # rc=0: clean decode
                  # rc=1: sips usage error (shouldn't happen)
                  # rc=13: "Cannot extract image from file" — codec/format failure
                  # rc=139: SIGSEGV (crash!) — potential bug
                  # rc=6: SIGABRT (crash!) — potential bug
                  if r.returncode == 0:
                      status = 'OK'
                  elif r.returncode in (139, 6, 11, 5):
                      status = 'CRASH'
                  elif r.returncode == 13:
                      status = 'DECODE_ERR'   # can't extract — codec path not reached OR invalid DNG
                  else:
                      status = f'ERR_{r.returncode}'
                  result = {
                      'file': fname,
                      'status': status,
                      'rc': r.returncode,
                      'elapsed': round(elapsed, 2),
                      'stdout': r.stdout[:500],
                      'stderr': r.stderr[:300],
                  }
              except subprocess.TimeoutExpired:
                  elapsed = time.time() - t0
                  result = {
                      'file': fname, 'status': 'HANG',
                      'rc': -1, 'elapsed': round(elapsed, 2),
                      'stdout': '', 'stderr': 'TIMEOUT',
                  }

              results.append(result)

              icon = {
                  'OK':         '     [ok]',
                  'CRASH':      '  [CRASH]',
                  'HANG':       '   [HANG]',
                  'DECODE_ERR': '[DEC-ERR]',
              }.get(result['status'], f'[{result["status"]}]')
              print(f"{icon}  {fname:<52}  rc={result['rc']:>4}  {elapsed:.2f}s")
              if result['status'] not in ('OK',):
                  if result['stderr']:
                      print(f"           stderr: {result['stderr'][:150]}")
                  if result['stdout']:
                      print(f"           stdout: {result['stdout'][:150]}")

          # Summary
          crashes     = [r for r in results if r['status'] == 'CRASH']
          hangs       = [r for r in results if r['status'] == 'HANG']
          ok          = [r for r in results if r['status'] == 'OK']
          decode_errs = [r for r in results if r['status'] == 'DECODE_ERR']
          other_errs  = [r for r in results if r['status'] not in ('OK','CRASH','HANG','DECODE_ERR')]

          print(f"\n{'='*70}")
          print(f"RESULTS: ok={len(ok)}  crash={len(crashes)}  hang={len(hangs)}  "
                f"decode_err={len(decode_errs)}  other={len(other_errs)}")
          print(f"{'='*70}\n")

          if ok:
              print(f"DECODED OK ({len(ok)} files) — these reached the codec and succeeded:")
              for r in ok:
                  print(f"  {r['file']}")

          if decode_errs:
              print(f"\nDECODE ERRORS ({len(decode_errs)}) — rc=13, codec/DNG validation failed:")
              for r in decode_errs:
                  print(f"  {r['file']}")

          if crashes:
              print(f"\n*** CRASH FINDINGS ({len(crashes)}) ***")
              for r in crashes:
                  print(f"  {r['file']}  rc={r['rc']}")
                  print(f"    {r['stderr']}")

          if hangs:
              print(f"\nHANG FINDINGS ({len(hangs)}):")
              for r in hangs:
                  print(f"  {r['file']}")

          with open('crash_report.json', 'w') as f:
              json.dump(results, f, indent=2)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"crash_count={len(crashes)}\n")
              f.write(f"hang_count={len(hangs)}\n")
              f.write(f"ok_count={len(ok)}\n")
              f.write(f"decode_err_count={len(decode_errs)}\n")

          # Fail the step on crashes/hangs to make them easy to spot
          if crashes or hangs:
              sys.exit(1)
          PYEOF

      - name: DIAGNOSTIC - decode output analysis (detect silent OOB via channel count)
        if: always()
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import subprocess, os

          # For mismatch files that return rc=0 with jpeg output, check the OUTPUT JPEG.
          # If SPP=1 (1-channel buffer allocated) but Nf=3 (JPEGL writes 3 channels):
          #   ch_out=3 → decoder trusted Nf, not SPP (OOB or graceful override)
          #   ch_out=1 → decoder truncated at outer SPP=1 (safe)
          #   ch_out=<nil> → sips can't read the output (grayscale or corrupt output)
          cases = [
              # (file, spp, nf, expected_channels_if_no_bug)
              ('corpus/DIAG_plain_tiff_rgb_8b.dng',       3, 3, 3),
              ('corpus/CTRL_tiff_jpegl_1spp_1nf_8b.dng',  1, 1, 1),
              ('corpus/CTRL_tiff_jpegl_3spp_3nf_8b.dng',  3, 3, 3),
              ('corpus/tiff_jpegl_1spp_3nf_8b.dng',        1, 3, '?'),  # OOB WRITE target
              ('corpus/tiff_jpegl_3spp_1nf_8b.dng',        3, 1, '?'),  # OOB READ target
              ('corpus/tiff_jpegl_1spp_4nf_8b.dng',        1, 4, '?'),  # OOB WRITE x4
              ('corpus/tiff_jpegl_4spp_1nf_8b.dng',        4, 1, '?'),  # OOB READ x4
          ]

          print("=" * 90)
          print(" Output JPEG analysis — channel count of sips-decoded output")
          print(" SPP=TIFF outer (malloc size), Nf=JPEGL inner (loop count)")
          print(f" {'File':<45} {'SPP':>3} {'Nf':>3} {'ch_out':>6}  verdict")
          print("=" * 90)

          for path, spp, nf, expected in cases:
              if not os.path.exists(path):
                  continue
              fname = os.path.basename(path)
              out = '/tmp/jpegl_decode_test.jpeg'
              r = subprocess.run(
                  ['sips', '-s', 'format', 'jpeg', path, '--out', out],
                  capture_output=True, text=True, timeout=20
              )
              if r.returncode != 0:
                  print(f"  {fname:<45} {spp:>3} {nf:>3}  rc={r.returncode:>3}  DECODE_ERR")
                  continue
              # Verify output exists and read its metadata
              if not os.path.exists(out):
                  print(f"  {fname:<45} {spp:>3} {nf:>3}  ch=???  NO_OUTPUT_FILE")
                  continue
              r2 = subprocess.run(
                  ['sips', '-g', 'samplesPerPixel', '-g', 'pixelWidth', '-g', 'pixelHeight', out],
                  capture_output=True, text=True, timeout=10
              )
              spp_out = None
              w_out = None
              for line in r2.stdout.splitlines():
                  if 'samplesPerPixel:' in line:
                      spp_out = line.split()[-1]
                  if 'pixelWidth:' in line:
                      w_out = line.split()[-1]
              # Also show raw file type
              file_r = subprocess.run(['file', out], capture_output=True, text=True)
              file_type = file_r.stdout.strip().split(': ', 1)[-1] if file_r.returncode == 0 else '?'
              verdict = '?'
              if spp_out is None:
                  verdict = 'sips returned no samplesPerPixel'
              elif spp_out == '<nil>':
                  # sips returns <nil> for 1-component (grayscale) JPEG — treat as ch=1
                  verdict = 'ch=<nil> → grayscale output (1-channel) — decoder used SPP=1, NOT Nf'
                  if nf != spp:
                      verdict += f'  *** SAFE: truncated at SPP={spp}, Nf={nf} ignored'
              else:
                  try:
                      ch = int(spp_out)
                      if ch == nf and ch != spp:
                          verdict = f'ch={ch} *** USED Nf NOT SPP — possible OOB write (SPP={spp} buffer, Nf={nf} writes)'
                      elif ch == spp:
                          verdict = f'ch={ch} — decoder truncated at outer SPP={spp} (safe)'
                      else:
                          verdict = f'ch={ch} UNEXPECTED (neither SPP={spp} nor Nf={nf})'
                  except ValueError:
                      verdict = f'ch={spp_out!r} PARSE_ERROR'
              print(f"  {fname:<45} {spp:>3} {nf:>3}  ch={spp_out or '?':>5}  {verdict}")
              # Parse JPEG markers to see if image data is actually present
              markers = []
              with open(out, 'rb') as f:
                  raw = f.read(512)
              i = 0
              while i < len(raw) - 1:
                  if raw[i] != 0xFF or raw[i+1] == 0x00 or raw[i+1] == 0xFF:
                      i += 1
                      continue
                  m = raw[i+1]
                  names = {0xD8:'SOI', 0xD9:'EOI', 0xE0:'APP0', 0xE1:'APP1',
                           0xC0:'SOF0', 0xC3:'SOF3', 0xC4:'DHT', 0xDA:'SOS',
                           0xDB:'DQT', 0xDD:'DRI'}
                  mname = names.get(m, f'0xFF{m:02X}')
                  markers.append(mname)
                  if m == 0xD8 or m == 0xD9:
                      i += 2
                  elif i + 3 < len(raw):
                      seg_len = (raw[i+2] << 8) | raw[i+3]
                      i += 2 + seg_len
                  else:
                      break
              print(f"    JPEG markers: {' → '.join(markers)}  (file={os.path.getsize(out)}B, file:{file_type[:60]})")
          PYEOF

      - name: Collect macOS crash reports
        if: always()
        run: |
          echo "=== All crash reports (sips / qlmanage / RawCamera / ImageIO) ==="
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          echo "--- Directory listing (all) ---"
          ls "$CRASH_DIR" 2>/dev/null || echo "(empty or missing)"
          echo ""
          echo "--- Matching reports (sips|qlmanage|quicklook|rawcamera|imagei) ---"
          ls "$CRASH_DIR" 2>/dev/null | grep -iE "sips|qlmanage|quicklook|rawcamera|imagei|imageio" || echo "No matching crash reports"
          find "$CRASH_DIR" -maxdepth 1 \( \
            -name "*sips*.ips"      -o -name "*sips*.crash"     \
            -o -name "*qlmanage*.ips"  -o -name "*qlmanage*.crash" \
            -o -name "*QuickLook*.ips" -o -name "*QuickLook*.crash" \
            -o -name "*RawCamera*.ips" -o -name "*RawCamera*.crash" \
            -o -name "*ImageIO*.ips"   -o -name "*ImageIO*.crash"   \
          \) 2>/dev/null | while read f; do
            echo ""
            echo "=== $f ==="
            head -100 "$f"
          done || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-results
          path: |
            crash_report.json
            corpus/
            ~/Library/Logs/DiagnosticReports/*sips*.ips
            ~/Library/Logs/DiagnosticReports/*sips*.crash
            ~/Library/Logs/DiagnosticReports/*qlmanage*.ips
            ~/Library/Logs/DiagnosticReports/*qlmanage*.crash
            ~/Library/Logs/DiagnosticReports/*QuickLook*.ips
            ~/Library/Logs/DiagnosticReports/*QuickLook*.crash
            ~/Library/Logs/DiagnosticReports/*RawCamera*.ips
            ~/Library/Logs/DiagnosticReports/*RawCamera*.crash
          if-no-files-found: ignore
          retention-days: 30

      - name: Final verdict
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo " CRASH COUNT: ${{ steps.crash_test.outputs.crash_count || 0 }}"
          echo " HANG  COUNT: ${{ steps.crash_test.outputs.hang_count  || 0 }}"
          echo " OK    COUNT: ${{ steps.crash_test.outputs.ok_count    || 0 }}"
          echo " DEC ERR:     ${{ steps.crash_test.outputs.decode_err_count || 0 }}"
          echo "=============================================="
          cat crash_report.json 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          crashes=[r for r in d if r['status']=='CRASH']
          ok=[r for r in d if r['status']=='OK']
          if crashes:
              print('POTENTIAL FINDINGS:')
              for r in crashes:
                  print(f'  [CRASH] {r[\"file\"]}  rc={r[\"rc\"]}')
                  print(f'    {r[\"stderr\"][:120]}')
          if ok:
              print(f'DECODED CLEAN: {len(ok)} files (codec path reached)')
              for r in ok:
                  print(f'  {r[\"file\"]}')
          if not crashes and not ok:
              print('No crashes and no successful decodes — all files hit rc=13 DECODE_ERR.')
              print('The DNG tag set is likely incorrect. Check the DIAGNOSTIC steps above.')
          " || true
