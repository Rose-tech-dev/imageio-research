name: Apple Intelligence Gen 4 - Targeted Deep Probe

# Gen 4: 4 services confirmed to accept unprivileged connections in Gen 3.
# Goals:
#   1. Extract REAL ObjC method names from the daemon binaries (nm + otool)
#   2. Run targeted Swift probe with those real names
#   3. Capture exception logs when the wrong selector name fires NSXPCDecoder
#   4. Confirm whether any method executes in the root daemon (OSIntelligence.battery/charging)
#
# Confirmed accepted services (TIMEOUT in Gen 3 = no connection-level entitlement check):
#   com.apple.intelligenceflow.contextIntelligence  (intelligencecontextd)
#   com.apple.OSIntelligence.battery               (ospredictiond, SYSTEM/root)
#   com.apple.OSIntelligence.charging              (ospredictiond, SYSTEM/root)
#   com.apple.suggestd.mail-intelligence           (suggestd)

on:
  workflow_dispatch:
  push:
    paths:
      - 'osint_targeted_probe.swift'
      - '.github/workflows/osint-gen4-targeted.yml'

jobs:
  gen4-probe:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          sw_vers
          echo "UID: $(id -u)  USER: $(whoami)  SIP: $(csrutil status 2>/dev/null)"

      # ── FIND AND DUMP REAL METHOD NAMES ───────────────────────────────
      - name: Binary recon - Find ospredictiond binary
        run: |
          echo "=== Find ospredictiond binary ==="
          PATHS=(
            "/System/Library/PrivateFrameworks/OSIntelligence.framework/Versions/A/Support/ospredictiond"
            "/System/Library/PrivateFrameworks/OSIntelligence.framework/ospredictiond"
            "/usr/libexec/ospredictiond"
            "/System/Library/PrivateFrameworks/OSIntelligence.framework/Versions/A/ospredictiond"
          )
          for p in "${PATHS[@]}"; do
            [ -f "$p" ] && echo "FOUND: $p" && ls -la "$p" && break || echo "not at $p"
          done

          echo ""
          echo "=== ospredictiond from pgrep ==="
          PID=$(pgrep -x "ospredictiond" 2>/dev/null | head -1)
          echo "PID: ${PID:-(not found)}"
          [ -n "$PID" ] && ps -p "$PID" -o pid,ppid,user,command 2>/dev/null || true

          echo ""
          echo "=== Find ospredictiond via proc ==="
          PID=$(pgrep "ospredictiond" 2>/dev/null | head -1)
          [ -n "$PID" ] && {
            ls -la /proc/$PID/exe 2>/dev/null || true
            cat /proc/$PID/cmdline 2>/dev/null | tr '\0' ' ' || true
          }

          echo ""
          echo "=== OSIntelligence framework contents ==="
          FW="/System/Library/PrivateFrameworks/OSIntelligence.framework"
          [ -d "$FW" ] && find "$FW" -type f | head -30 || echo "(not found: $FW)"

          echo ""
          echo "=== Find ospredictiond anywhere ==="
          find /System/Library /usr/libexec -name "ospredictiond" -type f 2>/dev/null \
            | head -5 || echo "(not found)"

          echo ""
          echo "=== ospredictiond plist for binary path ==="
          find /System/Library/LaunchDaemons -name "*osprediction*" -o -name "*OSIntelligence*" \
            2>/dev/null | while read f; do
            echo "PLIST: $f"
            plutil -p "$f" 2>/dev/null | grep -E "Program|Arguments|MachServices" | head -15
          done
        continue-on-error: true

      - name: Binary recon - ObjC methods in ospredictiond
        run: |
          # Get binary path from plist
          PLIST=$(find /System/Library/LaunchDaemons -name "*osprediction*" 2>/dev/null | head -1)
          echo "PLIST: ${PLIST:-(not found)}"
          BIN=""
          if [ -n "$PLIST" ]; then
            BIN=$(plutil -p "$PLIST" 2>/dev/null | grep "ProgramArguments\|Program" \
              | grep -o '"/[^"]*"' | head -1 | tr -d '"')
            echo "Binary from plist: $BIN"
          fi

          # Also check known framework locations
          for path in \
            "/System/Library/PrivateFrameworks/OSIntelligence.framework/Versions/A/ospredictiond" \
            "/usr/libexec/ospredictiond" \
            "/System/Library/PrivateFrameworks/OSIntelligence.framework/ospredictiond" \
            "$BIN"; do
            [ -f "$path" ] && { BIN="$path"; echo "Using: $BIN"; break; }
          done

          if [ -f "$BIN" ]; then
            echo ""
            echo "=== nm: OSIntelligence / battery / charging selectors ==="
            nm "$BIN" 2>/dev/null \
              | grep -iE "battery|charging|OSIntelligence|prediction|power|schedule|usage" \
              | grep -v "^[0-9a-f]* U " | head -50

            echo ""
            echo "=== otool -oV: ObjC class dump ==="
            otool -oV "$BIN" 2>/dev/null \
              | grep -A3 "name 0x" | head -100

            echo ""
            echo "=== strings: XPC method names ==="
            strings "$BIN" 2>/dev/null \
              | grep -E "^[a-z][a-zA-Z0-9]+(:|WithReply:|reply:)" | head -50

            echo ""
            echo "=== strings: com.apple service refs ==="
            strings "$BIN" 2>/dev/null \
              | grep "^com\.apple\.OSIntelligence" | head -20
          else
            echo "ospredictiond binary not directly accessible (dyld cache stub)"
            echo ""
            echo "=== Trying dyld cache extraction for OSIntelligence ==="
            strings /System/Library/dyld/dyld_shared_cache_arm64e 2>/dev/null \
              | grep -iE "battery|charging|OSIntelligence" \
              | grep -E "^[a-z][a-zA-Z]+(:|With|By|reply)" | head -30 || echo "(not found)"
          fi
        continue-on-error: true

      - name: Binary recon - ObjC methods in suggestd
        run: |
          echo "=== Find suggestd binary ==="
          find /System/Library -name "suggestd" -type f 2>/dev/null | head -5
          find /usr/libexec -name "suggestd" -type f 2>/dev/null | head -5

          PLIST=$(find /System/Library/LaunchDaemons /System/Library/LaunchAgents \
            -name "*suggestd*" 2>/dev/null | head -1)
          echo "PLIST: ${PLIST:-(not found)}"
          BIN=""
          [ -n "$PLIST" ] && BIN=$(plutil -p "$PLIST" 2>/dev/null \
            | grep "ProgramArguments\|Program" | grep -o '"/[^"]*"' | head -1 | tr -d '"')
          echo "Binary from plist: ${BIN:-(not found)}"

          for path in \
            "/usr/libexec/suggestd" \
            "/System/Library/PrivateFrameworks/ProactiveDaemonSupport.framework/Versions/A/Support/suggestd" \
            "$BIN"; do
            [ -f "$path" ] && { BIN="$path"; echo "Using: $BIN"; break; }
          done

          if [ -f "$BIN" ]; then
            echo ""
            echo "=== nm: mail / intelligence selectors ==="
            nm "$BIN" 2>/dev/null \
              | grep -iE "mail|intelligence|email|smart|reply|compose|suggest" \
              | grep -v "^[0-9a-f]* U " | head -60

            echo ""
            echo "=== strings: XPC method patterns ==="
            strings "$BIN" 2>/dev/null \
              | grep -E "^[a-z][a-zA-Z0-9]+(:|WithReply:|reply:|:reply:)" | head -50

            echo ""
            echo "=== strings: com.apple.suggestd refs ==="
            strings "$BIN" 2>/dev/null \
              | grep "com\.apple\.suggestd\." | head -20
          else
            echo "(suggestd not directly accessible — in dyld cache)"
            echo ""
            echo "=== dyld cache strings — suggestd patterns ==="
            strings /System/Library/dyld/dyld_shared_cache_arm64e 2>/dev/null \
              | grep -iE "mail.intelligence|mailIntell" \
              | grep -E "^[a-z]" | head -20 || echo "(not found)"
          fi
        continue-on-error: true

      - name: Binary recon - ObjC methods in intelligencecontextd
        run: |
          echo "=== Find intelligencecontextd binary ==="
          find /System/Library -name "intelligencecontextd" -type f 2>/dev/null | head -5

          PLIST=$(find /System/Library/LaunchDaemons /System/Library/LaunchAgents \
            -name "*intelligencecontextd*" -o -name "*intelligencecontext*" 2>/dev/null | head -1)
          echo "PLIST: ${PLIST:-(not found)}"
          BIN=""
          [ -n "$PLIST" ] && BIN=$(plutil -p "$PLIST" 2>/dev/null \
            | grep "ProgramArguments\|Program" | grep -o '"/[^"]*"' | head -1 | tr -d '"')

          for path in \
            "/System/Library/PrivateFrameworks/IntelligenceFlowRuntime.framework/Versions/A/Support/intelligencecontextd" \
            "/usr/libexec/intelligencecontextd" \
            "$BIN"; do
            [ -f "$path" ] && { BIN="$path"; echo "Using: $BIN"; break; }
          done

          if [ -f "$BIN" ]; then
            echo ""
            echo "=== nm: context / intelligence selectors ==="
            nm "$BIN" 2>/dev/null \
              | grep -iE "context|intelligence|personal|screen|ui|activity" \
              | grep -v "^[0-9a-f]* U " | head -60

            echo ""
            echo "=== strings: XPC method patterns ==="
            strings "$BIN" 2>/dev/null \
              | grep -E "^[a-z][a-zA-Z0-9]+(:|WithReply:|reply:|:reply:)" | head -50
          else
            echo "(not directly accessible)"
            echo ""
            echo "=== dyld cache strings — contextIntelligence ==="
            strings /System/Library/dyld/dyld_shared_cache_arm64e 2>/dev/null \
              | grep -iE "contextIntelligence" | head -20 || echo "(not found)"
          fi
        continue-on-error: true

      # ── COMPILE + RUN TARGETED PROBE ──────────────────────────────────
      - name: Compile osint_targeted_probe.swift
        run: |
          echo "=== Compiling Gen 4 targeted probe ==="
          swiftc osint_targeted_probe.swift -o /tmp/gen4_probe 2>&1
          echo "Exit: $?"
          ls -la /tmp/gen4_probe 2>/dev/null || echo "(compile failed — no binary)"

      - name: Run Gen 4 targeted probe
        timeout-minutes: 12
        run: |
          echo "=== Running Gen 4 targeted probe ==="
          echo "UID: $(id -u)  No entitlements."
          /tmp/gen4_probe 2>&1 || echo "(exited with error)"

      # ── EXCEPTION LOGS (key: NSXPCDecoder fires when selector doesn't match) ──
      - name: Logs - ospredictiond exception trace
        run: |
          echo "=== ospredictiond logs (last 5min) ==="
          log show \
            --predicate 'process == "ospredictiond" OR subsystem CONTAINS "OSIntelligence"' \
            --last 5m --info --debug 2>/dev/null | grep -v "^Timestamp" | head -200 \
            || echo "(no logs)"

          echo ""
          echo "=== Exception logs from ospredictiond ==="
          log show \
            --predicate 'process == "ospredictiond" AND (message CONTAINS "Exception" OR message CONTAINS "NSXPCDecoder" OR message CONTAINS "selector" OR message CONTAINS "received" OR message CONTAINS "dropping")' \
            --last 5m --info --debug 2>/dev/null | head -80 || echo "(none)"
        continue-on-error: true

      - name: Logs - suggestd + intelligencecontextd exceptions
        run: |
          echo "=== suggestd NSXPCDecoder exceptions (last 5min) ==="
          log show \
            --predicate 'process == "suggestd" AND (message CONTAINS "Exception" OR message CONTAINS "NSXPCDecoder" OR message CONTAINS "dropping" OR message CONTAINS "interface")' \
            --last 5m --info --debug 2>/dev/null | head -80 || echo "(none)"

          echo ""
          echo "=== suggestd full log (last 5min) ==="
          log show \
            --predicate 'process == "suggestd"' \
            --last 5m --info 2>/dev/null | grep -v "^Timestamp" | head -100 || echo "(none)"

          echo ""
          echo "=== intelligencecontextd NSXPCDecoder exceptions ==="
          log show \
            --predicate 'process == "intelligencecontextd" AND (message CONTAINS "Exception" OR message CONTAINS "NSXPCDecoder" OR message CONTAINS "dropping")' \
            --last 5m --info --debug 2>/dev/null | head -60 || echo "(none)"
        continue-on-error: true

      # ── BONUS: ProactiveDaemonSupport framework analysis ───────────────
      - name: ProactiveDaemonSupport framework analysis
        run: |
          FW="/System/Library/PrivateFrameworks/ProactiveDaemonSupport.framework"
          echo "=== ProactiveDaemonSupport.framework ==="
          [ -d "$FW" ] && {
            find "$FW" -type f | head -20
            echo ""
            echo "-- plists --"
            find "$FW" -name "*.plist" | while read f; do
              echo "PLIST: $f"
              plutil -p "$f" 2>/dev/null | head -20
            done

            echo ""
            echo "-- Binary nm: XPC delegate patterns ==="
            FWBIN="$FW/Versions/A/ProactiveDaemonSupport"
            [ -f "$FWBIN" ] && nm "$FWBIN" 2>/dev/null \
              | grep -iE "acceptNewConnection|shouldAccept|connectionValidation|entitlement|delegate" \
              | head -30 || echo "(binary not accessible)"
          } || echo "(ProactiveDaemonSupport framework not found)"

          echo ""
          echo "=== Checking for XPC delegate class pattern ==="
          # The rejection log said: "(ProactiveDaemonSupport) [com.apple.intelligenceflow:General]"
          # This tells us the delegate validation class is in ProactiveDaemonSupport
          # If we can find the protocol it validates, we can craft matching requests
          find /System/Library/PrivateFrameworks/ProactiveDaemonSupport.framework \
            -name "*.plist" 2>/dev/null | while read f; do
            plutil -p "$f" 2>/dev/null | grep -iE "entitlement|MachService|protocol" | head -10
          done || true
        continue-on-error: true

      - name: Gen 4 Summary
        run: |
          echo "=== GEN 4 SUMMARY ==="
          echo "Platform: macOS $(sw_vers -productVersion)"
          echo ""
          echo "CONFIRMED AUTH BYPASSES (from Gen 3):"
          echo "  1. com.apple.intelligenceflow.contextIntelligence  (intelligencecontextd)"
          echo "  2. com.apple.OSIntelligence.battery                (ospredictiond, SYSTEM/root)"
          echo "  3. com.apple.OSIntelligence.charging               (ospredictiond, SYSTEM/root)"
          echo "  4. com.apple.suggestd.mail-intelligence            (suggestd)"
          echo ""
          echo "Gen 4 goal: discover real method names and invoke at least one method"
          echo "on each accepted service to confirm full method-level access."
          echo ""
          echo "Any TIMEOUT or REPLY in probe output = method invocation bypassed entitlement gate."
          echo "Any NSXPCDecoder exception in logs = connection was accepted (bypass confirmed at"
          echo "  connection level), method name just doesn't match real protocol."
          echo ""
          echo "ospredictiond runs as SYSTEM (uid 0). Any successful method call = Critical."
