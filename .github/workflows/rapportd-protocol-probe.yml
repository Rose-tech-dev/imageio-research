name: rapportd Protocol Extraction and NSXPCProxy Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Find RPRemoteDisplayDevice framework
        run: |
          echo "=== Where is RPRemoteDisplayDevice defined? ==="
          # nm on rapportd shows it as undefined (U), so it comes from a framework
          nm -g /usr/libexec/rapportd 2>/dev/null | grep "RPRemoteDisplay" | head -10

          echo ""
          echo "=== Searching PrivateFrameworks for RPRemoteDisplayDevice ==="
          # Search only dylib/framework binaries
          for f in /System/Library/PrivateFrameworks/*.framework; do
            fw_name=$(basename "$f" .framework)
            binary="$f/$fw_name"
            if [ -f "$binary" ]; then
              if nm -g "$binary" 2>/dev/null | grep -q "RPRemoteDisplayDevice"; then
                echo "FOUND in: $binary"
                nm -g "$binary" 2>/dev/null | grep -E "(RPRemoteDisplay|NSXPCInterface)" | head -20
              fi
            fi
          done

          echo ""
          echo "=== Also check /usr/lib/ ==="
          for f in /usr/lib/*.dylib; do
            if nm -g "$f" 2>/dev/null | grep -q "RPRemoteDisplayDevice" 2>/dev/null; then
              echo "FOUND: $f"
            fi
          done

      - name: rapportd string analysis
        run: python3 rapportd_proto_strings.py 2>&1

      - name: nm deep dive - all protocol symbols across rapportd + imports
        run: |
          RAPPORT="/usr/libexec/rapportd"

          echo "=== All DEFINED ObjC protocols (nm OBJC_PROTOCOL_$) ==="
          nm -g "$RAPPORT" 2>/dev/null | grep "OBJC_PROTOCOL" | head -30 || echo "(none defined)"

          echo ""
          echo "=== All ObjC class names (DEFINED in rapportd) ==="
          nm -g "$RAPPORT" 2>/dev/null | grep "T _OBJC_CLASS" | awk '{print $3}' | sed 's/_OBJC_CLASS_\$_//' | sort | head -50

          echo ""
          echo "=== Undefined (imported) ObjC classes ==="
          nm -g "$RAPPORT" 2>/dev/null | grep "U _OBJC_CLASS" | awk '{print $2}' | sed 's/_OBJC_CLASS_\$_//' | sort | head -40

          echo ""
          echo "=== ObjC class names starting with RP ==="
          nm -g "$RAPPORT" 2>/dev/null | grep "OBJC_CLASS.*_RP" | head -40

          echo ""
          echo "=== All defined ObjC selectors containing 'Display' or 'Mirror' or 'Wombat' ==="
          strings "$RAPPORT" 2>/dev/null | grep -iE "^(display|mirror|wombat|session|startRemote|stopRemote)" | sort -u | head -30

          echo ""
          echo "=== String literals: all 'com.apple.' entries ==="
          strings "$RAPPORT" 2>/dev/null | grep "^com\.apple\." | sort -u | head -80

      - name: Search for RemoteDisplay framework binary
        run: |
          echo "=== PrivateFrameworks with Display/Mirror/Rapport/Phone in name ==="
          ls /System/Library/PrivateFrameworks/ | grep -iE "(display|mirror|rapport|phone|screen|capture|continu|iphone)" | head -30

          echo ""
          echo "=== Check Rapport.framework ==="
          ls -la /System/Library/PrivateFrameworks/Rapport.framework/ 2>/dev/null || echo "NOT FOUND"
          if [ -f "/System/Library/PrivateFrameworks/Rapport.framework/Rapport" ]; then
            echo "--- Rapport symbols ---"
            nm -g /System/Library/PrivateFrameworks/Rapport.framework/Rapport 2>/dev/null | grep -iE "(RemoteDisplay|NSXPCInterface|Protocol)" | head -20
            echo "--- Rapport strings ---"
            strings /System/Library/PrivateFrameworks/Rapport.framework/Rapport 2>/dev/null | grep -iE "(RemoteDisplay|Protocol|NSXPCInterface|entitlement)" | head -20
          fi

          echo ""
          echo "=== Check CoreTelephony.framework (has rapport-related XPC) ==="
          if [ -d "/System/Library/Frameworks/CoreTelephony.framework" ]; then
            nm -g /System/Library/Frameworks/CoreTelephony.framework/CoreTelephony 2>/dev/null | grep -iE "(RPRemote|rapport)" | head -10
          fi

          echo ""
          echo "=== launchctl services related to rapport/remote ==="
          launchctl list 2>/dev/null | grep -iE "(rapport|remote|display|mirror|phone|wifip2)" | head -20 || true

      - name: Search ScreenContinuityServices and Rapport framework for protocols
        run: |
          for fw in ScreenContinuityServices Rapport RapportUI CMContinuityCaptureCore; do
            binary="/System/Library/PrivateFrameworks/${fw}.framework/${fw}"
            if [ -f "$binary" ]; then
              echo "=== $fw ==="
              echo "--- nm: RPRemoteDisplay/Protocol symbols ---"
              nm -g "$binary" 2>/dev/null | grep -iE "(RPRemoteDisplay|OBJC_PROTOCOL|NSXPCInterface|Continuity)" | head -20
              echo "--- strings: protocol/interface keywords ---"
              strings "$binary" 2>/dev/null | grep -iE "(RemoteDisplay|Protocol|NSXPCInterface|entitlement|diagnosticCommand|Dedicated|SessionState)" | head -20
            else
              echo "No binary at $binary"
            fi
          done

          echo ""
          echo "=== Also probe via dyld_shared_cache_util if available ==="
          which dyld_shared_cache_util 2>/dev/null || echo "dyld_shared_cache_util not found"
          ls /System/Volumes/Preboot/Cryptexes/OS/usr/lib/dyld_shared_cache* 2>/dev/null | head -5 || echo "(not accessible)"

      - name: Compile and run NSXPCProxy protocol probe
        continue-on-error: true
        run: |
          echo "=== Compiling NSXPCProxy protocol probe ==="
          clang -o rapportd_nsxpc_proto_probe rapportd_nsxpc_proto_probe.m \
            -framework Foundation 2>&1 || true
          echo "Compile exit: $?"

          echo ""
          echo "=== Running probe ==="
          ./rapportd_nsxpc_proto_probe 2>&1 || true

      - name: Swift RemoteDisplay XPC method probe (remoteDisplay* methods)
        continue-on-error: true
        run: |
          echo "=== Compiling Swift RemoteDisplay method probe ==="
          swiftc rapportd_remotedisplay_probe.swift -o /tmp/rd_probe 2>&1
          echo "Compile exit: $?"

          echo ""
          echo "=== Running RemoteDisplay method probe ==="
          /tmp/rd_probe 2>&1 || true

      - name: Check rapportd logs after probe
        continue-on-error: true
        run: |
          echo "=== rapportd logs (last 30s, head -300 to capture Swift probe logs) ==="
          log show --predicate 'process == "rapportd"' --last 30s 2>/dev/null | \
            grep -vE "^\s+[0-9]+\s+(CoreFoundation|libobjc|Foundation|libxpc|libdispatch|libsystem)" | \
            grep -vE "(WiFiManagerClient|Logging)" | head -300 || true

      - name: Focused probe - remoteDisplayChangeDedicatedDevice 6s wait + log capture
        continue-on-error: true
        run: |
          PROBE_START=$(date -u "+%Y-%m-%d %H:%M:%S")
          echo "=== Probe start time: $PROBE_START ==="
          echo ""

          echo "=== Compiling focused ChangeDedicatedDevice probe ==="
          swiftc rapportd_changededicated_probe.swift -o /tmp/rd_focused 2>&1
          echo "Compile exit: $?"

          echo ""
          echo "=== Running focused probe (primary: 6s full wait on remoteDisplayChangeDedicatedDevice:nil) ==="
          /tmp/rd_focused 2>&1 || true

          echo ""
          echo "=== rapportd logs from probe window (start=$PROBE_START, stack frames filtered) ==="
          log show \
            --predicate 'process == "rapportd"' \
            --start "$PROBE_START" \
            2>/dev/null | \
            grep -vE "^\s+[0-9]+\s+(CoreFoundation|libobjc|Foundation|libxpc|libdispatch|libsystem)" | \
            head -250 || true

      - name: Non-nil class whitelist probe + log capture
        continue-on-error: true
        run: |
          PROBE_START=$(date -u "+%Y-%m-%d %H:%M:%S")
          echo "=== Non-nil probe start: $PROBE_START ==="

          echo "=== Compiling non-nil / class-spoof probe ==="
          swiftc rapportd_nonnull_probe.swift -o /tmp/rd_nonnull 2>&1
          echo "Compile exit: $?"

          echo ""
          echo "=== Running non-nil probe (NSObject / NSNull / NSString / fake RPRemoteDisplayDevice) ==="
          /tmp/rd_nonnull 2>&1 || true

          echo ""
          echo "=== rapportd logs from non-nil probe window ==="
          log show \
            --predicate 'process == "rapportd"' \
            --start "$PROBE_START" \
            2>/dev/null | \
            grep -vE "^\s+[0-9]+\s+(CoreFoundation|libobjc|Foundation|libxpc|libdispatch|libsystem)" | \
            head -300 || true

      - name: Entitlement check probing - SecTaskCopyValueForEntitlement
        run: |
          echo "=== Does rapportd use SecTask for connection entitlement checks? ==="
          strings /usr/libexec/rapportd 2>/dev/null | \
            grep -iE "(SecTask|SecCode|auditToken|entitlement|peer.*credential|connection.*credential)" | sort -u | head -20

          echo ""
          echo "=== Does rapportd check for specific entitlement keys? ==="
          strings /usr/libexec/rapportd 2>/dev/null | \
            grep -E "com\.apple\.(.*entitlement|developer\.|permission)" | sort -u | head -20

          echo ""
          echo "=== All 'com.apple.rapport' and 'com.apple.RemoteDisplay' entitlement strings ==="
          strings /usr/libexec/rapportd 2>/dev/null | \
            grep -iE "(com\.apple\.rapport|com\.apple\.RemoteDisplay)" | sort -u | head -30

          echo ""
          echo "=== NSXPCListener newConnectionHandler setup strings ==="
          strings /usr/libexec/rapportd 2>/dev/null | \
            grep -iE "(newConnection|listenerEndpoint|serviceListener|acceptConnection)" | head -10

      - name: Probe rapport.people and rapport.matching services
        run: |
          swiftc probe_rapport_services.swift -o /tmp/probe_extra 2>&1
          /tmp/probe_extra 2>&1 || true

      - name: Deep analysis - list all ObjC classes in rapportd
        run: |
          echo "=== All ObjC class names defined IN rapportd (otool classlist) ==="
          otool -ov /usr/libexec/rapportd 2>/dev/null | \
            grep "^\s*name\s\+0x" | grep -v "__mh_execute_header" | \
            awk '{print $NF}' | sort -u | head -100

          echo ""
          echo "=== ObjC protocol list section (protolist) ==="
          otool -s __DATA_CONST __objc_protolist /usr/libexec/rapportd 2>/dev/null | head -30
          otool -s __DATA __objc_protolist /usr/libexec/rapportd 2>/dev/null | head -30
