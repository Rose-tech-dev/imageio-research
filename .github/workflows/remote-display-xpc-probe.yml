name: rapportd Remote Display XPC and Binary Analysis

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: rapportd binary analysis - pref cross-references
        run: python3 rapportd_binary_analysis.py 2>&1

      - name: rapportd XPC service probe (ctypes)
        run: python3 rapportd_xpc_probe.py 2>&1

      - name: Swift XPC connection probe
        run: python3 rapportd_xpc_swift_probe.py 2>&1

      - name: RPRemoteDisplayDaemon class and XPC strings
        run: |
          RAPPORT="/usr/libexec/rapportd"

          echo "=== RPRemoteDisplayDaemon methods ==="
          strings "$RAPPORT" 2>/dev/null | grep -E "RPRemoteDisplay" | sort -u | head -40

          echo ""
          echo "=== RemoteDisplay and session strings ==="
          strings "$RAPPORT" 2>/dev/null | grep -iE "(RemoteDisplay|remoteDisplay|Wombat|wombat|SFPhone|SFSession|SFStream)" | sort -u | head -40

          echo ""
          echo "=== com.apple service names in rapportd ==="
          strings "$RAPPORT" 2>/dev/null | grep "com.apple" | sort -u | head -50

          echo ""
          echo "=== ObjC selectors - auth and connection ==="
          strings "$RAPPORT" 2>/dev/null | grep -iE "(authenticate|checkEntitlement|checkPermission|startMirroring|stopMirroring|findListener|createConnection)" | sort -u | head -25

      - name: Test _prefIPEnabled infrastructure browsing
        run: python3 rapportd_ip_browse_test.py 2>&1
