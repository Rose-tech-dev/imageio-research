name: rdlink PoC Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: System info and rapportd status
        run: |
          sw_vers
          echo "rapportd PID:" $(pgrep rapportd || echo "not running")
          echo "Local IP:" $(ipconfig getifaddr en0 2>/dev/null || echo "no en0")

      - name: TCP probe - advertise rdlink and companion-link services
        run: |
          python3 rdlink_probe.py

      - name: Check rapportd system logs post-probe
        run: |
          echo "=== rapportd RECENT LOGS ==="
          log show --predicate 'process == "rapportd"' --last 2m 2>/dev/null \
            | grep -iE "(rdlink|TestRapport|TestComp|TestIdent|connect|unauth|found|bonjour|9999)" \
            | head -60 || true

          echo ""
          echo "=== mDNSResponder - rdlink queries ==="
          log show --predicate 'process == "mDNSResponder"' --last 2m 2>/dev/null \
            | grep -iE "(rdlink|TestRapport|TestComp|TestIdent)" \
            | head -30 || true

          echo ""
          echo "=== Browse for rdlink in environment ==="
          timeout 8 dns-sd -B _rdlink._tcp local 2>/dev/null || true

          echo ""
          echo "=== Browse for companion-link ==="
          timeout 8 dns-sd -B _companion-link._tcp local 2>/dev/null || true

      - name: QUIC UDP probe for _asquic._udp
        run: |
          python3 quic_probe.py

      - name: rapportd process check after probes
        run: |
          echo "=== rapportd STILL RUNNING? ==="
          pgrep -la rapportd || echo "rapportd NOT FOUND (may have crashed)"
          echo ""
          echo "=== CRASH REPORTER LOGS ==="
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i rapport | head -10 || echo "No crash reports"
          ls /Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i rapport | head -10 || echo "No system crash reports"
