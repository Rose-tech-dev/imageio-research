name: rdlink PoC Probe - Does rapportd Connect to Arbitrary Services?

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Write listener script
        run: |
          cat > /tmp/listener.py << 'PYEOF'
import socket
import threading
import time
import subprocess
import sys

received_data = []
connections_seen = []

def hex_dump(data, prefix='  '):
    for i in range(0, len(data), 16):
        chunk = data[i:i+16]
        hex_part = ' '.join('%02x' % b for b in chunk)
        ascii_part = ''.join(chr(b) if 32 <= b < 127 else '.' for b in chunk)
        print('%s%04x: %-48s  %s' % (prefix, i, hex_part, ascii_part))

def handle_conn(conn, addr):
    print('[+] TCP connection from %s:%d' % addr, flush=True)
    connections_seen.append(addr)
    try:
        conn.settimeout(8)
        data = conn.recv(8192)
        if data:
            print('[+] Received %d bytes initial data:' % len(data), flush=True)
            hex_dump(data)
            received_data.append(('tcp', addr, data))
            # Send malformed frame: claim 0xFFFFFF bytes but only send 4
            malformed = bytes([0xFF, 0xFF, 0xFF, 0xFF, 0x01, 0x00, 0x00, 0x00])
            conn.sendall(malformed)
            print('[+] Sent malformed oversized-length frame', flush=True)
            time.sleep(3)
            resp = conn.recv(4096)
            if resp:
                print('[+] Response after malformed frame: %d bytes' % len(resp), flush=True)
                hex_dump(resp)
    except Exception as e:
        print('[+] Connection ended: %s' % e, flush=True)
    finally:
        conn.close()

srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(('0.0.0.0', 9999))
srv.listen(10)
srv.settimeout(1)
print('[+] TCP listener on port 9999', flush=True)

# Advertise _rdlink._tcp
dns1 = subprocess.Popen(['dns-sd', '-R', 'TestRapportMirror', '_rdlink._tcp', 'local', '9999', 'rpfl=0', 'rpld=0'])
# Also try _companion-link._tcp
dns2 = subprocess.Popen(['dns-sd', '-R', 'TestCompLink', '_companion-link._tcp', 'local', '9999', 'rpfl=0'])
# And _identityservice._tcp
dns3 = subprocess.Popen(['dns-sd', '-R', 'TestIdentSvc', '_identityservice._tcp', 'local', '9999'])

print('[+] Advertising _rdlink._tcp, _companion-link._tcp, _identityservice._tcp on port 9999', flush=True)

end_time = time.time() + 35
while time.time() < end_time:
    try:
        conn, addr = srv.accept()
        t = threading.Thread(target=handle_conn, args=(conn, addr))
        t.daemon = True
        t.start()
    except socket.timeout:
        pass

dns1.terminate()
dns2.terminate()
dns3.terminate()
srv.close()

print('', flush=True)
print('=== RESULTS ===', flush=True)
print('Total connections: %d' % len(connections_seen), flush=True)
print('Total data received: %d bytes' % sum(len(d[2]) for d in received_data), flush=True)
if connections_seen:
    print('SUCCESS: rapportd (or another process) connected to our service!', flush=True)
    for svc, addr, data in received_data:
        print('  From %s:%d - %d bytes' % (addr[0], addr[1], len(data)), flush=True)
else:
    print('No connections - rapportd requires paired device or different trigger', flush=True)
PYEOF
          echo "Listener script written to /tmp/listener.py"

      - name: Run probe and capture rapportd behavior
        run: |
          echo "=== SYSTEM INFO ==="
          sw_vers
          echo ""
          echo "=== rapportd PID ==="
          pgrep rapportd || echo "rapportd not running"
          echo ""
          echo "=== LOCAL IP ==="
          ipconfig getifaddr en0 2>/dev/null || echo "no en0"
          echo ""
          echo "=== STARTING PROBE ==="
          python3 /tmp/listener.py 2>&1

      - name: Check rapportd system logs
        run: |
          echo "=== rapportd RECENT LOGS ==="
          log show --predicate 'process == "rapportd"' --last 2m 2>/dev/null | grep -iE "(rdlink|remote.display|bonjour|connect|unauth|found|Test|9999)" | head -60 || true

          echo ""
          echo "=== mDNSResponder LOGS (Bonjour browsing) ==="
          log show --predicate 'process == "mDNSResponder"' --last 2m 2>/dev/null | grep -iE "(rdlink|TestRapport|TestCompLink|TestIdentSvc)" | head -30 || true

          echo ""
          echo "=== BROWSE FOR rdlink SERVICES ==="
          timeout 8 dns-sd -B _rdlink._tcp local 2>/dev/null || true

          echo ""
          echo "=== BROWSE FOR companion-link ==="
          timeout 8 dns-sd -B _companion-link._tcp local 2>/dev/null || true

      - name: QUIC UDP probe for _asquic._udp
        run: |
          cat > /tmp/quic_probe.py << 'PYEOF'
import socket
import subprocess
import time

srv = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(('0.0.0.0', 9997))
srv.settimeout(1)

dns = subprocess.Popen(['dns-sd', '-R', 'TestQUICSvc', '_asquic._udp', 'local', '9997'])
print('[QUIC] Listening on UDP 9997, advertising _asquic._udp', flush=True)

packets = []
end_time = time.time() + 20
while time.time() < end_time:
    try:
        data, addr = srv.recvfrom(65535)
        print('[QUIC] Got UDP packet from %s:%d - %d bytes' % (addr[0], addr[1], len(data)), flush=True)
        for i in range(0, min(len(data), 128), 16):
            chunk = data[i:i+16]
            print('  %04x: %s' % (i, ' '.join('%02x' % b for b in chunk)), flush=True)
        packets.append((data, addr))
    except socket.timeout:
        pass

dns.terminate()
print('[QUIC] Total packets: %d' % len(packets), flush=True)
if packets:
    print('[QUIC] SUCCESS - rapportd/wifip2pd sent QUIC Initial packet to us!', flush=True)
else:
    print('[QUIC] No QUIC packets received', flush=True)
PYEOF
          python3 /tmp/quic_probe.py 2>&1
