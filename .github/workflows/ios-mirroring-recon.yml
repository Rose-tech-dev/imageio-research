name: iOS Mirroring Recon

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Install ipsw
        run: |
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Get iOS 18.5 URL
        id: url
        run: |
          URL=$(ipsw download ipsw --device iPhone16,1 --version 18.5 --urls 2>&1 | grep "^http" | head -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "URL: $URL"

      - name: Extract kernelcache (unencrypted, always works)
        run: |
          mkdir -p /tmp/kernel
          ipsw download ipsw \
            --device iPhone16,1 \
            --version 18.5 \
            --kernel \
            --output /tmp/kernel \
            --confirm 2>&1 | tail -20
          find /tmp/kernel -type f | head -20

      - name: Analyze kernelcache - new kexts and syscalls
        run: |
          KRNL=$(find /tmp/kernel -name "kernelcache*" | head -1)
          echo "Kernel: $KRNL"
          if [ -n "$KRNL" ]; then
            echo "=== NEW MACH TRAPS / SYSCALLS ==="
            ipsw kernel kext list "$KRNL" 2>/dev/null | grep -iE "(mirror|remote|continuity|phone|screen|display|IPC|XPC)" | sort -u || true
            echo ""
            echo "=== ALL KEXT BUNDLES ==="
            ipsw kernel kext list "$KRNL" 2>/dev/null | head -100 || true
          fi

      - name: Extract remote/mirror daemon binaries via pattern
        run: |
          mkdir -p /tmp/binaries
          ipsw download ipsw \
            --device iPhone16,1 \
            --version 18.5 \
            --pattern ".*[Rr]emote.*|.*[Mm]irror.*|.*[Cc]ontinuity.*|.*screencast.*|.*[Ff]eatures.*plist" \
            --output /tmp/binaries \
            --flat \
            --confirm 2>&1 | tail -20
          echo "=== EXTRACTED BINARIES ==="
          find /tmp/binaries -type f | sort

      - name: Analyze the macOS runner's OWN dyld cache for remote frameworks
        run: |
          echo "=== macOS RUNNER DYLD CACHE LOCATION ==="
          find /System /private -name "dyld_shared_cache_arm64e" 2>/dev/null | head -5
          CACHE=$(find /System /private -name "dyld_shared_cache_arm64e" 2>/dev/null | head -1)
          if [ -n "$CACHE" ]; then
            echo "Found: $CACHE"
            echo ""
            echo "=== MIRROR/REMOTE/CONTINUITY IMAGES ==="
            ipsw dyld image "$CACHE" 2>/dev/null | grep -iE "(mirror|remote|continuity|phone|screen|IPhone)" | sort -u
            echo ""
            echo "=== ALL DAEMON-LIKE PATHS ==="
            ipsw dyld image "$CACHE" 2>/dev/null | grep -E "(libexec|daemon|agent)" | sort -u | head -40
          fi

      - name: Dump entitlements for remote/mirror images (macOS cache)
        run: |
          CACHE=$(find /System /private -name "dyld_shared_cache_arm64e" 2>/dev/null | head -1)
          if [ -n "$CACHE" ]; then
            for img in $(ipsw dyld image "$CACHE" 2>/dev/null | grep -iE "(mirror|remote|continuity)" | awk '{print $NF}' | head -10); do
              echo "=== $img ==="
              ipsw dyld ent "$CACHE" --image "$img" 2>/dev/null || true
            done
          fi

      - name: Dump exports for RemoteUI CoreRemoteUI (macOS cache)
        run: |
          CACHE=$(find /System /private -name "dyld_shared_cache_arm64e" 2>/dev/null | head -1)
          if [ -n "$CACHE" ]; then
            echo "=== RemoteUI EXPORTS ==="
            ipsw dyld exports "$CACHE" --image "/System/Library/PrivateFrameworks/RemoteUI.framework/RemoteUI" 2>/dev/null | head -200 || true
            echo ""
            echo "=== CoreRemoteUI EXPORTS ==="
            ipsw dyld exports "$CACHE" --image "/System/Library/PrivateFrameworks/CoreRemoteUI.framework/CoreRemoteUI" 2>/dev/null | head -200 || true
          fi

      - name: Search LaunchDaemons plists for mirroring services (macOS runner)
        run: |
          echo "=== LAUNCH DAEMONS WITH mirror/remote/continuity ==="
          grep -rl "mirror\|Mirror\|RemoteUI\|PhoneMirror" \
            /System/Library/LaunchDaemons \
            /System/Library/LaunchAgents \
            2>/dev/null | head -20
          echo ""
          echo "=== PLIST CONTENTS ==="
          for f in $(grep -rl "mirror\|Mirror\|PhoneMirror" /System/Library/LaunchDaemons /System/Library/LaunchAgents 2>/dev/null | head -5); do
            echo "--- $f ---"
            cat "$f"
            echo ""
          done

      - name: Upload all results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-recon-results
          path: |
            /tmp/kernel/
            /tmp/binaries/
          retention-days: 7
          if-no-files-found: warn
