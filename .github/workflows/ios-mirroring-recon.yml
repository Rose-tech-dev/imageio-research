name: iOS Mirroring Recon

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Install ipsw
        run: |
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Find iOS 18.5 IPSW URL
        id: url
        run: |
          URL=$(ipsw download ipsw --device iPhone16,1 --version 18.5 --urls 2>&1 | grep "^http" | head -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "URL: $URL"

      - name: Download dyld shared cache (arm64e, HTTP range - no full IPSW)
        run: |
          mkdir -p /tmp/dyld
          ipsw download ipsw \
            --device iPhone16,1 \
            --version 18.5 \
            --dyld \
            --arch arm64e \
            --output /tmp/dyld \
            --confirm 2>&1 | tail -30
          echo "=== EXTRACTED ==="
          find /tmp/dyld -type f | head -20

      - name: List all images in dyld cache
        run: |
          CACHE=$(find /tmp/dyld -name "dyld_shared_cache_arm64e" | head -1)
          echo "Cache: $CACHE"
          if [ -n "$CACHE" ]; then
            echo "=== ALL IMAGES (mirror/remote/continuity/phone/screen) ==="
            ipsw dyld image "$CACHE" | grep -iE "(mirror|remote|continuity|phone|screen|display|cast)" | sort -u
            echo ""
            echo "=== ALL IMAGES (xpc/service/daemon) ==="
            ipsw dyld image "$CACHE" | grep -iE "(xpc|daemon|service)" | sort -u
          fi

      - name: Extract entitlements for remote/mirror images
        run: |
          CACHE=$(find /tmp/dyld -name "dyld_shared_cache_arm64e" | head -1)
          if [ -n "$CACHE" ]; then
            echo "=== ENTITLEMENTS ==="
            for img in $(ipsw dyld image "$CACHE" | grep -iE "(mirror|remote|continuity)" | awk '{print $NF}'); do
              echo "--- $img ---"
              ipsw dyld ent "$CACHE" --image "$img" 2>/dev/null || true
            done
          fi

      - name: Dump exports for RemoteUI and CoreRemoteUI
        run: |
          CACHE=$(find /tmp/dyld -name "dyld_shared_cache_arm64e" | head -1)
          if [ -n "$CACHE" ]; then
            echo "=== RemoteUI EXPORTS ==="
            ipsw dyld exports "$CACHE" --image RemoteUI 2>/dev/null | head -150 || true
            echo ""
            echo "=== CoreRemoteUI EXPORTS ==="
            ipsw dyld exports "$CACHE" --image CoreRemoteUI 2>/dev/null | head -150 || true
            echo ""
            echo "=== Continuity EXPORTS ==="
            ipsw dyld exports "$CACHE" | grep -iE "mirror|handoff|phone" | head -100 || true
          fi

      - name: Pattern search - if dyld failed, extract binaries directly
        if: always()
        run: |
          if ! find /tmp/dyld -name "dyld_shared_cache_arm64e" | grep -q .; then
            echo "=== DYLD CACHE NOT EXTRACTED - TRYING PATTERN MATCH ==="
            mkdir -p /tmp/pattern
            ipsw download ipsw \
              --device iPhone16,1 \
              --version 18.5 \
              --pattern ".*[Mm]irror.*|.*[Rr]emoteUI.*|.*[Cc]ontinuity.*|.*[Pp]hone[Mm]irroring.*" \
              --output /tmp/pattern \
              --confirm 2>&1 | tail -20 || true
            find /tmp/pattern -type f
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-mirroring-results
          path: |
            /tmp/dyld/
            /tmp/pattern/
          retention-days: 7
          if-no-files-found: warn
